tooltip:
  en_us: >-
    Assigns elements to worksets. MP-/MS- systems go to Pipe - Mechanical, PL-/PP- to Pipe - Plumbing,
    piping below the underground level to Pipe - Underground, SSW point families (name starts with SSW and contains Point) to Points - Control/Layout,
    and hangers (BOP parameter) to Hangers - Mechanical/Plumbing by Support Discipline, then Comments.
    Links are handled by Assign Links to Worksets. Elements owned by others are skipped.
    Asks first whether to use the selection, elements visible in the view, or the whole project.
    Shift+Click to change the underground level.

title:
