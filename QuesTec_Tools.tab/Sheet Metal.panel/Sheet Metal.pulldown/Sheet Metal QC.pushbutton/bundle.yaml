tooltip:
  en_us: >-
    Checks ducts, duct fittings, flex ducts and fabrication ductwork (not duct accessories) for a blank
    Material or Specification Name (Identity Data), and Radius Bend fittings for an Angle outside
    44-46 or 89-91 degrees. Uses the current selection if there is one, otherwise what's
    visible in the active view. Elements with issues are temporarily isolated and selected, and a
    summary of the issues is shown.

