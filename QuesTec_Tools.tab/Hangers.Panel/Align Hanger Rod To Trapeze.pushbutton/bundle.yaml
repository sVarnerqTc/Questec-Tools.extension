tooltip:
  en_us: Finds trapeze hangers in the active view, validates the selected or in-view trapeze elevation, and aligns the top of hanger rods to the trapeze. Works for hangers with Select Upper Attachment = 6 and can reset non-zero Added Rod Extension values when prompted.


