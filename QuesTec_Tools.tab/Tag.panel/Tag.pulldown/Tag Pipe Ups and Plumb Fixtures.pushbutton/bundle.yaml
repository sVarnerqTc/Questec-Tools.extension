tooltip:
  en_us: >-
    In the active plan view, tags pipes that cross the chosen deck level with an UP tag placed at the
    bottom-right of the pipe (default offset 1 ft up). Uses the current selection if there is one,
    otherwise all pipes in the view. Pipes already tagged with the same tag type are skipped.

